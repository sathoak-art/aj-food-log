<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>AJ Food Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #101418; --card: #1a2027; --card2: #222a33; --line: #2e3842; --text: #e8edf2; --muted: #93a1ae;
  --accent: #4fa3ff; --good: #3fbf7f; --warn: #e0a83a; --over: #ef5b5b; --plan: #a98bf0;
  --radius: 14px; --gut: 16px;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f3f5f8; --card: #ffffff; --card2: #eef1f5; --line: #d8dee6; --text: #141a21; --muted: #5d6b78;
    --accent: #1a6fd6; --good: #1f9a5c; --warn: #b07a10; --over: #d33a3a; --plan: #7353d0; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
main { max-width: 640px; margin: 0 auto; padding: 12px var(--gut) 24px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 10px 0; }
.center { text-align: center; } .center .primary { margin: 12px auto 6px; }
.row { display: flex; gap: 8px; align-items: center; } .row.wrap { flex-wrap: wrap; } .spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
@media (min-width: 520px) { .grid6 { grid-template-columns: repeat(6, 1fr); } }
label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
input, select, textarea { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
textarea { min-height: 64px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.danger { color: var(--over); }
button.big { padding: 12px 18px; font-size: 16px; }
button.small { padding: 5px 9px; font-size: 13px; }
button.link { background: none; border: none; color: var(--accent); padding: 4px 0; }
button.icon { background: none; border: none; font-size: 18px; padding: 4px 8px; }
button:disabled { opacity: .5; }
label.btn { display: inline-flex; flex-direction: row; align-items: center; gap: 4px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; color: var(--text); font-size: 15px; white-space: nowrap; }
label.btn.small { padding: 5px 9px; font-size: 13px; }
label.btn.primary-soft { border-color: var(--accent); color: var(--accent); font-weight: 600; }

/* nav */
nav#nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav#nav button { flex: 1; border: none; border-radius: 0; background: none; padding: 14px 2px; font-size: 13px; color: var(--muted); }
nav#nav button.on { color: var(--accent); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }

/* today */
.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; vertical-align: middle; white-space: nowrap; }
.b-certain { color: var(--good); } .b-likely { color: var(--accent); } .b-uncertain { color: var(--warn); }
.b-planned { color: var(--plan); } .b-closed { color: var(--muted); } .b-pending { color: var(--warn); } .b-open { color: var(--good); }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.metric { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: left; white-space: normal; }
.metric .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.metric .v { font-size: 16px; font-weight: 600; }
.metric .s { font-size: 11px; color: var(--muted); }
.bars { display: grid; gap: 9px; }
.bar .lbl { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
.bar .lbl b { font-weight: 600; }
.bar .track { position: relative; height: 9px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }
.bar .plan { position: absolute; top: 0; bottom: 0; background: var(--plan); opacity: .45; }
.bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); opacity: .55; }
.bar.good .fill { background: var(--good); } .bar.warn .fill { background: var(--warn); } .bar.over .fill { background: var(--over); }
.bar.over .lbl .st { color: var(--over); font-weight: 600; } .bar.good .lbl .st { color: var(--good); } .bar.warn .lbl .st { color: var(--warn); }
.balance { font-size: 15px; }
.balance b { font-size: 20px; }
.entries { list-style: none; margin: 0; padding: 0; }
.entry { border-top: 1px solid var(--line); padding: 10px 2px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.entry:first-child { border-top: none; }
.entry .e-main { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.entry .e-time { color: var(--muted); font-size: 12px; min-width: 38px; }
.entry .e-label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .e-n { grid-column: 1; font-size: 12px; color: var(--muted); padding-left: 46px; }
.entry .e-k { font-weight: 600; text-align: right; }
.entry.planned { opacity: .8; } .entry.planned .e-label { color: var(--plan); }
.entry.removed { opacity: .5; text-decoration: line-through; }
.quick { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; }
.quick form { display: flex; gap: 6px; }
.banner { border-color: var(--warn); }
.flag { border-left: 3px solid var(--warn); padding: 6px 10px; margin: 6px 0; background: var(--card2); border-radius: 6px; font-size: 14px; }
.flag.info { border-left-color: var(--accent); } .flag.good { border-left-color: var(--good); } .flag.bad { border-left-color: var(--over); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
tr.click { cursor: pointer; }
.tablewrap { overflow-x: auto; }
.st-over { color: var(--over); font-weight: 600; } .st-good { color: var(--good); } .st-warn { color: var(--warn); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); padding: 10px 2px; cursor: pointer; }
.list li:first-child { border-top: none; }
.list .t { font-weight: 600; } .list .d { font-size: 12px; color: var(--muted); }
.code { font-family: ui-monospace, Consolas, monospace; background: var(--card2); border-radius: 6px; padding: 1px 6px; font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chips button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: none; border-radius: 0; }
.seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
.seg button.on.plan { background: var(--plan); }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--line); } .chart text { fill: var(--muted); font-size: 10px; }
.chart .dot { fill: var(--accent); } .chart .avg { stroke: var(--good); stroke-width: 2.5; fill: none; }
.chart .goal { stroke: var(--warn); stroke-dasharray: 4 4; } .chart .band { fill: var(--good); opacity: .12; }
.chart .ib { fill: var(--accent); } .chart .ib.over { fill: var(--over); } .chart .burn { stroke: var(--warn); stroke-width: 2; fill: none; } .chart .bdot { fill: var(--warn); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 20; display: none; }
#sheet.open { display: block; }
#sheet .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
#sheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line); padding: 0 var(--gut) calc(16px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
.sheet-h { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 14px 0 8px; z-index: 2; }
.sheet-f { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); background: var(--bg); display: flex; gap: 8px; justify-content: flex-end; padding: 12px 0; border-top: 1px solid var(--line); margin-top: 12px; }
.sheet-f .primary { min-width: 110px; }
.stack > * + * { margin-top: 10px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 8px 0; }
.item .ih { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item .ih b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.item .ir { display: grid; grid-template-columns: 1fr 1.2fr; gap: 6px; margin-top: 6px; }
.item .in { font-size: 12px; color: var(--muted); margin-top: 6px; }
.item.eggoil { border-style: dashed; }
.unit { position: relative; } .unit span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.unit input { padding-right: 30px; }
.results { margin-top: 6px; }
.results button { display: block; width: 100%; text-align: left; margin: 4px 0; white-space: normal; }
.results .d { font-size: 12px; color: var(--muted); }
.tot { font-weight: 600; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 10px; }
.err { color: var(--over); font-size: 14px; }
.warnbox { border: 1px solid var(--warn); border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: 14px; }
.thumb { max-width: 100%; max-height: 220px; border-radius: 10px; border: 1px solid var(--line); margin-top: 6px; }
#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; } #toast.bad { background: var(--over); color: #fff; }
.fatal { padding: 24px; }
</style>
</head>
<body>
<main id="view"><p class="muted">Loading…</p></main>
<nav id="nav"></nav>
<div id="sheet"><div class="scrim" data-act="closeSheet"></div><div class="panel" id="sheetBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="calc.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
